{% extends "base.html" %} {% block title %}关注 · 墨智帖{% endblock %} {% block
extra_css %}
<link rel="stylesheet" href="/static/css/follow.css" />
{% endblock %} {% block content %}
<main class="container community-main follow-page">
  <!-- 页面标题 -->
  <section class="community-header">
    <h1>关注与粉丝</h1>
    <p class="subtitle">管理你的关注关系，发现更多书法同好</p>
  </section>

  <!-- 社区功能导航栏 -->
  <section class="community-nav">
    <div class="community-nav-tabs">
      <a href="/community" class="nav-tab">
        <span class="tab-icon">🏠</span>
        <span class="tab-text">首页</span>
      </a>
      <a href="/community/topics" class="nav-tab">
        <span class="tab-icon">📚</span>
        <span class="tab-text">话题分类</span>
      </a>
      <a href="/community/follow" class="nav-tab active">
        <span class="tab-icon">👥</span>
        <span class="tab-text">关注/粉丝</span>
      </a>
      <a href="/community/notifications" class="nav-tab">
        <span class="tab-icon">🔔</span>
        <span class="tab-text">消息通知</span>
        <span
          class="notification-badge"
          id="navNotificationBadge"
          style="display: none"
          >0</span
        >
      </a>
      <a href="/community/feedback" class="nav-tab">
        <span class="tab-icon">💬</span>
        <span class="tab-text">意见反馈</span>
      </a>
    </div>
  </section>

  <!-- 关注页面专属导航 -->
  <div class="follow-tabs">
    <button class="tab-btn active" data-tab="following">我关注的</button>
    <button class="tab-btn" data-tab="followers">关注我的</button>
  </div>

  <!-- 搜索和筛选工具栏 -->
  <div class="follow-toolbar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="search" class="search-input" placeholder="搜索用户..." />
    </div>
    <div class="filter-options">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="recent">最近活跃</button>
      <button class="filter-btn" data-filter="popular">最受欢迎</button>
    </div>
  </div>

  <!-- 用户网格 -->
  <div class="users-grid">
    <!-- 用户卡片列表将由 JavaScript 动态生成 -->
  </div>
</main>
{% endblock %} {% block extra_js %}
<script src="/static/js/follow.js" defer></script>
{% endblock %}
