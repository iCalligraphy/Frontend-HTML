{% extends "base.html" %} {% block title %}墨智帖 · 发现与分享书法之美{%
endblock %} {% block content %}
<main>
  <!-- 英雄区 -->
  <section class="hero">
    <div class="container hero-inner">
      <div class="hero-text">
        <h1>发现与分享书法之美</h1>
        <p class="subtitle">
          沉浸式浏览作品（缩放/拖拽）实时多维检索、创建并分享字集；社区支持发帖、点赞、评论与每日打卡。/单字/字集一键切换）、互动社区（发帖、点赞评论、每日打卡，交流书法心得）。
        </p>
      </div>
  </section>

  <!-- 筛选与视图切换 -->
  <section class="toolbar">
    <div class="container toolbar-inner">
      <div class="filters">
        <div class="filter-group">
          <span class="label">风格：</span>
          <button type="button" class="chip" data-style="kai">楷</button>
          <button type="button" class="chip" data-style="xing">行</button>
          <button type="button" class="chip" data-style="cao">草</button>
          <button type="button" class="chip" data-style="li">隶</button>
          <button type="button" class="chip" data-style="zhuan">篆</button>
        </div>
        <div class="filter-group">
          <label for="authorInput" class="label">作者：</label>
          <input id="authorInput" type="text" placeholder="如 王羲之" />
        </div>
        <div class="filter-group">
          <label for="sourceSelect" class="label">来源：</label>
          <select id="sourceSelect">
            <option value="all">全部</option>
            <option value="system">系统</option>
            <option value="user">用户</option>
          </select>
        </div>
      </div>
      <div class="view-switch">
        <button type="button" id="gridViewBtn" class="view-btn active">
          网格
        </button>
        <button type="button" id="listViewBtn" class="view-btn">列表</button>
      </div>
    </div>
  </section>

  <!-- 作品展示：网格视图 -->
  <section id="worksGrid" class="works container">
    <div class="works-grid"></div>
    <div class="pagination">
      <button type="button" class="page-btn" disabled>上一页</button>
      <span class="page-info">第 1 页 · 共 0 页</span>
      <button type="button" class="page-btn">下一页</button>
    </div>
  </section>

  <!-- 作品展示：列表视图 -->
  <section id="worksList" class="works container hidden">
    <div class="list-wrapper"></div>
    <div class="pagination">
      <button type="button" class="page-btn" disabled>上一页</button>
      <span class="page-info">第 1 页 · 共 0 页</span>
      <button type="button" class="page-btn">下一页</button>
    </div>
  </section>
</main>
{% endblock %}
