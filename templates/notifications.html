{% extends "base.html" %}

{% block title %}消息通知 · iCalligraphy{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/community.css" />
<link rel="stylesheet" href="/static/css/notifications.css" />
{% endblock %}

{% block content %}
<main class="container community-main notifications-page">
  <!-- 页面标题 -->
  <section class="community-header">
    <h1>消息通知</h1>
    <p class="subtitle">及时了解社区动态和互动信息</p>
  </section>

  <!-- 社区功能导航栏 -->
  <section class="community-nav">
    <div class="community-nav-tabs">
      <a href="/community" class="nav-tab">
        <span class="tab-icon">🏠</span>
        <span class="tab-text">首页</span>
      </a>
      <a href="/community/topics" class="nav-tab">
        <span class="tab-icon">📚</span>
        <span class="tab-text">话题分类</span>
      </a>
      <a href="/community/follow" class="nav-tab">
        <span class="tab-icon">👥</span>
        <span class="tab-text">关注/粉丝</span>
      </a>
      <a href="/community/notifications" class="nav-tab active">
        <span class="tab-icon">🔔</span>
        <span class="tab-text">消息通知</span>
        <span class="notification-badge" id="navNotificationBadge" style="display: none;">0</span>
      </a>
      <a href="/community/feedback" class="nav-tab">
        <span class="tab-icon">💬</span>
        <span class="tab-text">意见反馈</span>
      </a>
    </div>
  </section>

  <!-- 通知页面内容（全宽布局） -->
  <div class="notifications-content">
    <!-- 消息统计和操作区域 -->
    <div class="notifications-header">
      <div class="notifications-stats">
        <div class="stat-card">
          <span class="stat-label">未读消息</span>
          <span class="stat-value" id="unreadCount">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">今日消息</span>
          <span class="stat-value" id="todayCount">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">本周消息</span>
          <span class="stat-value" id="weekCount">0</span>
        </div>
      </div>
      <div class="notifications-actions">
        <button class="btn btn-outline mark-all-read">
          <span class="btn-icon">✓</span>
          全部标记已读
        </button>
        <button class="btn btn-secondary" id="clearAllBtn">
          <span class="btn-icon">🗑️</span>
          清空所有通知
        </button>
      </div>
    </div>

    <!-- 通知类型筛选 -->
    <div class="notification-tabs">
      <button class="type-tab active" data-type="all">全部</button>
      <button class="type-tab" data-type="like">点赞</button>
      <button class="type-tab" data-type="comment">评论</button>
      <button class="type-tab" data-type="follow">关注</button>
      <button class="type-tab" data-type="mention">@提到</button>
      <button class="type-tab" data-type="system">系统</button>
    </div>

    <!-- 批量操作区 -->
    <div class="batch-actions" style="display: none;">
      <label class="batch-checkbox">
        <input type="checkbox" class="select-all-checkbox">
        <span class="checkmark"></span>
        全选
      </label>
      <div class="batch-actions-buttons">
        <button class="btn-batch" data-action="mark-read">
          <span class="btn-icon">✓</span>
          标记已读
        </button>
        <button class="btn-batch delete" data-action="delete">
          <span class="btn-icon">🗑️</span>
          删除
        </button>
      </div>
    </div>

    <!-- 通知列表 -->
    <div class="notifications-list">
      <!-- 通知内容将由 JavaScript 动态生成 -->
    </div>

    <!-- 加载更多 -->
    <div class="load-more">
      <button class="btn btn-secondary" id="loadMoreBtn">加载更多通知</button>
    </div>
  </div>
</main>
{% endblock %}

{% block extra_js %}
<script src="/static/js/notifications.js" defer></script>
{% endblock %}
