{% extends "base.html" %} {% block title %}话题分类 · 墨智帖{% endblock %} {%
block extra_css %}
<link rel="stylesheet" href="/static/css/community.css" />
<link rel="stylesheet" href="/static/css/topics.css" />
{% endblock %} {% block content %}
<main class="container community-main topics-page">
  <!-- 页面标题 -->
  <section class="community-header">
    <h1>话题分类</h1>
    <p class="subtitle">按兴趣分类浏览社区内容</p>
  </section>

  <!-- 社区功能导航栏 -->
  <section class="community-nav">
    <div class="community-nav-tabs">
      <a href="/community" class="nav-tab">
        <span class="tab-icon">🏠</span>
        <span class="tab-text">首页</span>
      </a>
      <a href="/community/topics" class="nav-tab active">
        <span class="tab-icon">📚</span>
        <span class="tab-text">话题分类</span>
      </a>
      <a href="/community/follow" class="nav-tab">
        <span class="tab-icon">👥</span>
        <span class="tab-text">关注/粉丝</span>
      </a>
      <a href="/community/notifications" class="nav-tab">
        <span class="tab-icon">🔔</span>
        <span class="tab-text">消息通知</span>
        <span
          class="notification-badge"
          id="navNotificationBadge"
          style="display: none"
          >0</span
        >
      </a>
    </div>
  </section>

  <!-- 话题页面专属导航 -->
  <div class="topics-tabs">
    <button class="topic-tab-btn active" data-tab="all">全部话题 (5)</button>
    <button class="topic-tab-btn" data-tab="following">
      关注话题 (<span id="followingCount">0</span>)
    </button>
  </div>

  <!-- 搜索和筛选工具栏 -->
  <div class="topics-toolbar">
    <div class="topics-search-box">
      <span class="search-icon">🔍</span>
      <input
        type="search"
        class="topics-search-input"
        placeholder="搜索话题..."
      />
    </div>
    <div class="topics-filter-options">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="popular">热门</button>
      <button class="filter-btn" data-filter="newest">最新</button>
    </div>
  </div>

  <!-- 话题网格 -->
  <div class="topics-grid" id="topicsGrid">
    <!-- 话题卡片列表将由 JavaScript 动态生成 -->
  </div>
</main>
{% endblock %} {% block extra_js %}
<script src="/static/js/topics.js" defer></script>
{% endblock %}
