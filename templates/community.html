{% extends "base.html" %}

{% block title %}社区 · 墨智帖{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/community.css" />
{% endblock %}

{% block content %}
    <main class="container community-main">
      <!-- 页面标题 -->
      <section class="community-header">
        <h1>书法社区</h1>
        <p class="subtitle">分享交流心得，记录练习历程，共同探索书法艺术</p>
      </section>



      <div class="community-layout">
        <!-- 左侧内容区 -->
        <div class="community-content">
          <!-- 每日打卡区域 -->
          <section class="daily-checkin">
            <div class="checkin-card">
              <div class="checkin-header">
                <h2>每日打卡</h2>
                <span class="streak-badge">已连续打卡 <strong id="streakDays">0</strong> 天</span>
              </div>
              <div class="checkin-content">
                <p class="checkin-tip">坚持每日练字，养成良好习惯</p>
                <button id="checkinBtn" class="btn btn-primary btn-large">
                  <span class="btn-icon">✓</span>
                  <span class="btn-text">今日打卡</span>
                </button>
                <p class="checkin-status" id="checkinStatus"></p>
              </div>
              <div class="checkin-calendar">
                <div class="calendar-days" id="calendarDays">
                  <!-- 日历网格将由 JavaScript 生成 -->
                </div>
              </div>
            </div>
          </section>

          <!-- 发帖区域 -->
          <section class="post-composer">
            <div class="composer-card">
              <h3>发布新帖</h3>
              <div class="composer-form">
                <input type="text" id="postTitle" class="input-field" placeholder="标题（选填）" maxlength="100" />
                <textarea id="postContent" class="textarea-field" placeholder="分享你的书法心得、练习成果或提出问题..." rows="4" maxlength="2000"></textarea>
                <div class="composer-topic-select">
                  <label for="composerTopicSelect" class="topic-select-label">选择话题</label>
                  <select id="composerTopicSelect" class="topic-select-input">
                    <option value="">请选择话题</option>
                  </select>
                </div>
                <div class="composer-footer">
                  <div class="char-count">
                    <span id="charCount">0</span> / 2000
                  </div>
                  <button id="publishBtn" class="btn btn-primary">发布</button>
                </div>
              </div>
            </div>
          </section>

          <!-- 帖子筛选 -->
          <section class="post-filters">
            <div class="filter-tabs">
              <button class="filter-tab active" data-filter="all">全部</button>
              <button class="filter-tab" data-filter="following">关注的人</button>
              <!-- 话题选择框 -->
              <div class="topic-select-dropdown">
                <select id="topicSelect" class="topic-select-input">
                  <option value="all">全部话题</option>
                </select>
              </div>
            </div>
            <div class="filter-search">
              <input type="search" id="postSearch" placeholder="搜索帖子..." />
            </div>
          </section>

          <!-- 帖子列表 -->
          <section class="posts-list" id="postsList">
                          <div class="comments-section hidden">
                <div class="comment-composer">
                  <input type="text" class="comment-input" placeholder="写下你的评论..." />
                  <button class="btn btn-small">发送</button>
                </div>
                <div class="comments-list"></div>
              </div>
            </article>


              <div class="comments-section hidden">
                <div class="comment-composer">
                  <input type="text" class="comment-input" placeholder="写下你的评论..." />
                  <button class="btn btn-small">发送</button>
                </div>
                <div class="comments-list"></div>
              </div>
            </article>
          </section>

          <!-- 加载更多 -->
          <div class="load-more">
            <button class="btn btn-secondary" id="loadMoreBtn">加载更多</button>
          </div>
        </div>
        <!-- 右侧侧边栏：话题关注列表（红框位置） -->
        <aside class="community-sidebar">
          <div class="sidebar-card">
            <div class="sidebar-header">
              <h4>热门话题</h4>
              <p class="sidebar-sub">关注你感兴趣的话题，获取最新内容</p>
            </div>
            <ul id="sidebarTopicsList" class="sidebar-topics">
              <!-- 由 JavaScript 填充话题项，示例结构：
                <li class="sidebar-topic" data-topic-id="1">
                  <div class="topic-info">
                    <span class="topic-icon">🖌️</span>
                    <div class="topic-meta">
                      <div class="topic-name">技法交流</div>
                      <div class="topic-desc">讨论笔法、结构等</div>
                    </div>
                  </div>
                  <button class="topic-follow-btn" data-topic-id="1">关注</button>
                </li>
              -->
            </ul>
          </div>
        </aside>
      </div>
    </main>
{% endblock %}

{% block extra_js %}
<script src="/static/js/community.js" defer></script>
{% endblock %}
