{% extends "base.html" %} {% block title %}个人中心 · 墨智帖{% endblock %} {%
block extra_css %}
<link rel="stylesheet" href="/static/css/community.css" />
<link rel="stylesheet" href="/static/css/notifications.css" />
<link rel="stylesheet" href="/static/css/follow.css" />
<link rel="stylesheet" href="/static/css/profile.css" />
{% endblock %} {% block content %}
<main class="container profile-page">
  <!-- 用户头部信息区 -->
  <div class="profile-header">
    <div class="profile-header-inner">
      <!-- 用户头像与基本信息 -->
      <div class="user-card">
        <div class="avatar-section">
          <img
            id="userAvatar"
            class="avatar"
            src="/static/default-avatar.png"
            alt="用户头像"
          />
          <label for="avatarInput" class="avatar-upload-btn">
            <span>更换头像</span>
            <input
              type="file"
              id="avatarInput"
              accept="image/*"
              style="display: none"
            />
          </label>
        </div>
        <div class="user-info">
          <h1 id="userName" class="user-name">加载中...</h1>
          <p id="userBio" class="user-bio">暂无简介</p>
          <div class="user-actions">
            <button class="btn btn-primary" id="editProfileBtn">
              编辑资料
            </button>
          </div>
        </div>
      </div>

      <!-- 统计数据卡片 -->
      <div class="stats-section">
        <div class="stat-card" id="worksStatCard">
          <div class="stat-number" id="worksCount">0</div>
          <div class="stat-label">作品</div>
        </div>
        <!-- 已移除：帖子 统计卡 -->
        <div class="stat-card" id="followersStatCard">
          <div class="stat-number" id="followersCount">0</div>
          <div class="stat-label">粉丝</div>
        </div>
        <div class="stat-card" id="notificationsStatCard">
          <div class="stat-number" id="notificationsCount">0</div>
          <div class="stat-label">未读通知</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 标签页导航 -->
  <div class="tabs-wrapper">
    <div class="tabs">
      <button class="tab-button active" data-tab="works">
        <span class="tab-icon">📚</span>
        <span>我上传的作品</span>
      </button>
      <!-- 我的字集 标签已临时注释
      <button class="tab-button" data-tab="collections">
        <span class="tab-icon">🗂️</span>
        <span>我的字集</span>
      </button>
      -->
      <!-- 已移除：我的帖子 标签 -->
      <button class="tab-button" data-tab="follow">
        <span class="tab-icon">👥</span>
        <span>关注/粉丝</span>
      </button>
      <button class="tab-button" data-tab="notifications">
        <span class="tab-icon">🔔</span>
        <span>消息通知</span>
        <span
          class="notification-badge"
          id="navNotificationBadge"
          style="display: none"
          >0</span
        >
      </button>
      <button class="tab-button" data-tab="settings">
        <span class="tab-icon">⚙️</span>
        <span>账户设置</span>
      </button>
    </div>
  </div>

  <!-- 标签页内容 -->
  <div class="tabs-content">
    <!-- 我的作品标签页 -->
    <div id="works" class="tab-content active">
      <div id="worksContainer" class="content-container">
        <div class="loading-spinner">
          <div class="spinner"></div>
          <p>加载中...</p>
        </div>
      </div>
    </div>

    <!-- 已移除：我的帖子 标签页 -->

    <!-- 关注/粉丝 标签页（来自 community/follow.html） -->
    <div id="follow" class="tab-content">
      <div class="content-container">
        <div class="follow-tabs">
          <button class="tab-btn active" data-tab="following">我关注的</button>
          <button class="tab-btn" data-tab="followers">关注我的</button>
        </div>

        <div class="follow-toolbar">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input
              type="search"
              class="search-input"
              placeholder="搜索用户..."
            />
          </div>
          <div class="filter-options">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="recent">最近活跃</button>
            <button class="filter-btn" data-filter="popular">最受欢迎</button>
          </div>
        </div>

        <div class="users-grid">
          <!-- 用户卡片列表将由 JavaScript 动态生成 -->
        </div>
      </div>
    </div>

    <!-- 消息通知标签页 -->
    <div id="notifications" class="tab-content">
      <div class="content-container">
        <div class="notifications-content">
          <div class="notifications-header">
            <div class="notifications-stats">
              <div class="stat-card">
                <span class="stat-label">未读消息</span>
                <span class="stat-value" id="unreadCount">0</span>
              </div>
              <div class="stat-card">
                <span class="stat-label">今日消息</span>
                <span class="stat-value" id="todayCount">0</span>
              </div>
              <div class="stat-card">
                <span class="stat-label">本周消息</span>
                <span class="stat-value" id="weekCount">0</span>
              </div>
            </div>
            <div class="notifications-actions">
              <button class="btn btn-outline mark-all-read">
                <span class="btn-icon">✓</span>
                全部标记已读
              </button>
              <button class="btn btn-secondary" id="clearAllBtn">
                <span class="btn-icon">🗑️</span>
                清空所有通知
              </button>
            </div>
          </div>

          <div class="notification-tabs">
            <button class="type-tab active" data-type="all">全部</button>
            <button class="type-tab" data-type="like">点赞</button>
            <button class="type-tab" data-type="comment">评论</button>
            <button class="type-tab" data-type="follow">关注</button>
            <button class="type-tab" data-type="mention">@提到</button>
            <button class="type-tab" data-type="system">系统</button>
          </div>

          <div class="batch-actions" style="display: none">
            <label class="batch-checkbox">
              <input type="checkbox" class="select-all-checkbox" />
              <span class="checkmark"></span>
              全选
            </label>
            <div class="batch-actions-buttons">
              <button class="btn-batch" data-action="mark-read">
                <span class="btn-icon">✓</span>
                标记已读
              </button>
              <button class="btn-batch delete" data-action="delete">
                <span class="btn-icon">🗑️</span>
                删除
              </button>
            </div>
          </div>

          <div class="notifications-list">
            <!-- 通知内容将由 JavaScript 动态生成 -->
          </div>

          <div class="load-more">
            <button class="btn btn-secondary" id="loadMoreBtn">
              加载更多通知
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 账户设置标签页 -->
    <div id="settings" class="tab-content">
      <div class="settings-container">
        <!-- 基本信息编辑 -->
        <div class="settings-section">
          <h3 class="settings-title">基本信息</h3>
          <div class="form-group">
            <label for="editEmail">邮箱地址</label>
            <input
              type="email"
              id="editEmail"
              class="form-input"
              placeholder="请输入邮箱地址"
            />
          </div>
          <div class="form-group">
            <label for="editBio">个人简介</label>
            <textarea
              id="editBio"
              class="form-textarea"
              placeholder="请输入个人简介（选填）"
            ></textarea>
          </div>
          <button class="btn btn-primary" id="saveProfileBtn">保存资料</button>
        </div>

        <!-- 密码修改 -->
        <div class="settings-section">
          <h3 class="settings-title">修改密码</h3>
          <div class="form-group">
            <label for="oldPassword">当前密码</label>
            <input
              type="password"
              id="oldPassword"
              class="form-input"
              placeholder="请输入当前密码"
            />
          </div>
          <div class="form-group">
            <label for="newPassword">新密码</label>
            <input
              type="password"
              id="newPassword"
              class="form-input"
              placeholder="请输入新密码"
            />
          </div>
          <div class="form-group">
            <label for="confirmPassword">确认密码</label>
            <input
              type="password"
              id="confirmPassword"
              class="form-input"
              placeholder="请再次输入新密码"
            />
          </div>
          <button class="btn btn-primary" id="changePasswordBtn">
            修改密码
          </button>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- 成功/错误消息提示 -->
<div id="toast" class="toast"></div>

<!-- 用户列表模态框（粉丝/关注） -->
<div id="userListModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">列表</h3>
      <button class="modal-close" id="modalCloseBtn">&times;</button>
    </div>
    <div id="modalBody" class="modal-body">
      <!-- 内容动态插入 -->
    </div>
  </div>
</div>
{% endblock %} {% block extra_js %}
<script src="/static/js/profile.js" defer></script>
<script src="/static/js/follow.js" defer></script>
<script src="/static/js/notifications.js" defer></script>
{% endblock %}
